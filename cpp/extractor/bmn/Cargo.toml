[package]
name = "bmn"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# When updating these dependencies, run `rust/update_cargo_deps.sh`
[dependencies]
anyhow = "1"
cached = "0.54"
chrono = "0.4"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_with = "1"
num_cpus = "1"
tempfile = "3"
walkdir = "2"
which = "8"
os_str_bytes = "7.1.1"
rayon = "1.11.0"
all_asserts = "2.3.3"
itertools = "0.14.0"
zip = "9.0.5"

[lints]
workspace = true
