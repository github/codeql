extensions:
  - addsTo:
      pack: codeql/unified-all
      extensible: sinkModel
    data:
      - ["os", "Member[os_log].Argument[0]", "log-injection"]
      - ["os", "Member[os_log].WithNamedArgument[dso].WithoutNamedArgument[type].Argument[0,2]", "log-injection"]
      - ["os", "Member[os_log].WithNamedArgument[type].Argument[0,1]", "log-injection"]
      - ["os", "Member[os_log].WithNamedArgument[log].WithoutNamedArgument[dso].Argument[1]", "log-injection"]
      - ["os.Logger", "Member[warning].Argument[0]", "log-injection"]
      - ["os.Logger", "Member[error].Argument[0]", "log-injection"]
      - ["os.Logger", "Member[critical].Argument[0]", "log-injection"]
      - ["os.Logger", "Member[debug].Argument[0]", "log-injection"]
      - ["os.Logger", "Member[fault].Argument[0]", "log-injection"]
      - ["os.Logger", "Member[info].Argument[0]", "log-injection"]
      - ["os.Logger", "Member[log].Argument[0]", "log-injection"]
      - ["os.Logger", "Member[log].WithNamedArgument[level].Argument[0]", "log-injection"]
      - ["os.Logger", "Member[notice].Argument[0]", "log-injection"]
      - ["os.Logger", "Member[trace].Argument[0]", "log-injection"]
