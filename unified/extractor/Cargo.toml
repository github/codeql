[package]
name = "codeql-extractor-unified"
description = "CodeQL Unified extractor"
version = "0.1.0"
authors = ["GitHub"]
edition = "2024"

[lints]
workspace = true

# When updating these dependencies, run `rust/update_cargo_deps.sh`
[dependencies]
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
rayon = "1.12.0"
regex = "1.13.1"
encoding = "0.2"
codeql-extractor = { path = "../../shared/tree-sitter-extractor" }
yeast = { path = "../../shared/yeast" }
swift-parser = { path = "../swift-parser" }
