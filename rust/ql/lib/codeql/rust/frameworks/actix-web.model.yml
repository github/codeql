extensions:
  - addsTo:
      pack: codeql/rust-all
      extensible: sourceModel
    data:
      - ["<actix_web::route::Route>::to", "Argument[0].Parameter[0..7]", "remote", "manual"]
      # Actix attributes such as `get` expand to this `to` call on the handler.
      - ["<actix_web::resource::Resource>::to", "Argument[0].Parameter[0..7]", "remote", "manual"]
  - addsTo:
      pack: codeql/rust-all
      extensible: sinkModel
    data:
        - ["<actix_web::types::html::Html>::new", "Argument[0]", "html-injection", "manual"]
  - addsTo:
      pack: codeql/rust-all
      extensible: summaryModel
    data:
        - ["<actix_web::types::path::Path>::into_inner", "Argument[self]", "ReturnValue", "taint", "manual"]
  - addsTo:
      pack: codeql/rust-all
      extensible: neutralModel
    data:
      - ["<actix_web::info::ConnectionInfo as actix_web::extract::FromRequest>::from_request", "sink", "manual"]
      - ["<actix_web::request::HttpRequest>::connection_info", "sink", "manual"]
      - ["<actix_web::request::HttpRequest>::full_url", "sink", "manual"]
      - ["<actix_web::request::HttpRequest>::url_for", "sink", "manual"]
      - ["<actix_web::request::HttpRequest>::url_for_static", "sink", "manual"]
      - ["<actix_web::rmap::ResourceMap>::url_for", "sink", "manual"]
      - ["<actix_web::service::ServiceRequest>::connection_info", "sink", "manual"]
