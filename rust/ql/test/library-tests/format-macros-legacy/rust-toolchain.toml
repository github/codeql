# Pinned to a pre-1.94 toolchain on purpose.
#
# rust-analyzer 0.0.347 only expands the builtin `format_args!` machinery against
# a std that carries the new lowering (roughly >= 1.94). On older toolchains the
# format-family macros (`format!`, `println!`, `write!`, ...) fail to expand, so
# the extractor reconstructs the `FormatArgsExpr` itself. This test exercises that
# reconstruction path, which the default test toolchain never hits.
#
# Any toolchain named here must also be pre-installed in `../setup.sh`, otherwise
# the parallel QL tests race on `rustup` auto-install.
[toolchain]
channel = "1.93"
profile = "minimal"
components = [ "rust-src" ]
