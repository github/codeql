on:
  issue_comment:
    types: [created]

cache-mode: write

jobs:
  pr-comment:
    permissions: read-all
    runs-on: ubuntu-latest
    steps:
      - uses: xt0rted/pull-request-comment-branch@v2
        id: comment-branch

      - uses: actions/checkout@v3
        if: success()
        with:
          ref: ${{ steps.comment-branch.outputs.head_sha }}

      - uses: actions/cache@v2 # Cache alert: workflow write mode allows saving untrusted PR files.
        with:
          path: ./poison
          key: poison_key
      - run: |
          cat poison

  cache-modes:
    permissions: {}
    uses: ./.github/workflows/cache_mode_reusable.yml # No cache alert: harmless access probes, despite write permission.
