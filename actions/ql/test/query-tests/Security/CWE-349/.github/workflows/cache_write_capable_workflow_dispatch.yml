on: workflow_dispatch

jobs:
  cache:
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - env:
          HEAD_SHA: ${{ github.event.inputs.head_sha }}
        run: |
          git fetch origin "$HEAD_SHA"
          git checkout "$HEAD_SHA"
      - run: npm install
      - uses: actions/cache@v4
        with:
          path: .npm
          key: workflow-dispatch
