on:
  issue_comment:
    types: [created]

cache-mode: write-only

jobs:
  pr-comment:
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - uses: xt0rted/pull-request-comment-branch@v2
        id: comment-branch
      - uses: actions/checkout@v3
        with:
          ref: ${{ steps.comment-branch.outputs.head_sha }}
      - run: ./checkedout/poison # Cache alert: untrusted code inherits write-only cache access.

  pr-comment2:
    cache-mode: read
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - uses: xt0rted/pull-request-comment-branch@v2
        id: comment-branch
      - uses: actions/checkout@v3
        with:
          ref: ${{ steps.comment-branch.outputs.head_sha }}
      - uses: ./.github/actions/node-npm-setup # No cache alert: job read mode prevents saves.

  pr-comment3:
    cache-mode: none
    runs-on: ubuntu-latest
    permissions: read-all
    steps:
      - uses: xt0rted/pull-request-comment-branch@v2
        id: comment-branch
      - uses: actions/checkout@v3
        with:
          ref: ${{ steps.comment-branch.outputs.head_sha }}
      - run: node .github/actions-scripts/what-docs-early-access-branch.js # No cache alert: job none mode disables cache access.

  cache-modes:
    permissions: {}
    uses: ./.github/workflows/cache_mode_reusable.yml # No cache alert: callee write exceeds the write-only limit.
