name: Self repository action after PR checkout

on: pull_request_target

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # Not poisonable: `$/` actions are fetched at the running commit, not from the workspace
      - uses: $/.github/actions/self-repository-harmless
