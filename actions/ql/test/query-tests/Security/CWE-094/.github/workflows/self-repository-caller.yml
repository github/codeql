name: Self repository caller

on: pull_request_target

permissions:
  contents: write
  pull-requests: write

jobs:
  call-reusable:
    uses: $/.github/workflows/self-repository-reusable.yml
    with:
      title: ${{ github.event.pull_request.title }}
  call-action:
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/self-repository-action
        with:
          who: ${{ github.event.pull_request.title }}
