extensions:
  - addsTo:
      pack: codeql/python-all
      extensible: sourceModel
    data:
      # `mcp`, the official Model Context Protocol SDK. The parameters of tool, resource and prompt
      # handlers are chosen by the MCP client, that is by an LLM or by anyone who can reach the server.
      # `FastMCP` (1.x) was renamed to `MCPServer` (2.x).
      - ['mcp.server.fastmcp.FastMCP', 'Member[tool,resource,prompt].ReturnValue.Argument[0].Parameter[any]', 'remote']
      - ['mcp.server.fastmcp.FastMCP', 'Member[add_tool].Argument[0,fn:].Parameter[any]', 'remote']
      - ['mcp.server.mcpserver.MCPServer', 'Member[tool,resource,prompt].ReturnValue.Argument[0].Parameter[any]', 'remote']
      - ['mcp.server.mcpserver.MCPServer', 'Member[add_tool].Argument[0,fn:].Parameter[any]', 'remote']
      # The low-level server: decorators in 1.x, constructor handlers taking `(ctx, params)` in 2.x.
      - ['mcp.server.lowlevel.Server', 'Member[call_tool,read_resource,get_prompt].ReturnValue.Argument[0].Parameter[any]', 'remote']
      - ['mcp.server.lowlevel.Server!', 'Argument[on_call_tool:,on_get_prompt:].Parameter[1].Member[arguments]', 'remote']
      - ['mcp.server.lowlevel.Server!', 'Argument[on_read_resource:].Parameter[1].Member[uri]', 'remote']
      # The bearer token of the Authorization header reaches token verifiers and the access-token helper.
      - ['mcp.server.auth.provider.TokenVerifier!', 'Subclass.Member[verify_token].Parameter[0,token:]', 'remote']
      - ['mcp', 'Member[server].Member[auth].Member[middleware].Member[auth_context].Member[get_access_token].ReturnValue.Member[token]', 'remote']

  - addsTo:
      pack: codeql/python-all
      extensible: typeModel
    data:
      # The classes are re-exported; instances of any import path are instances of the class.
      - ['mcp.server.fastmcp.FastMCP!', 'mcp', 'Member[server].Member[fastmcp].Member[server].Member[FastMCP]']
      - ['mcp.server.fastmcp.FastMCP', 'mcp.server.fastmcp.FastMCP!', 'Instance']
      - ['mcp.server.mcpserver.MCPServer!', 'mcp', 'Member[server].Member[MCPServer]']
      - ['mcp.server.mcpserver.MCPServer!', 'mcp', 'Member[server].Member[mcpserver].Member[server].Member[MCPServer]']
      - ['mcp.server.mcpserver.MCPServer', 'mcp.server.mcpserver.MCPServer!', 'Instance']
      - ['mcp.server.lowlevel.Server!', 'mcp', 'Member[server].Member[Server]']
      - ['mcp.server.lowlevel.Server!', 'mcp', 'Member[server].Member[lowlevel].Member[server].Member[Server]']
      - ['mcp.server.lowlevel.Server', 'mcp.server.lowlevel.Server!', 'Instance']
